{% extends "articles/prerender_base.html" %}

{% block prerendered_body %}
      <div class="pre">
        <nav aria-label="مسیر صفحه"><a href="/">ارزلرن</a> › <span>{{ heading }}</span></nav>
        <h1>{{ heading }}</h1>
        <p>{{ page_description }}</p>
        {% if body_html %}{{ body_html|safe }}{% endif %}
        <nav aria-label="پیوندهای اصلی">
          <a href="/">صفحه اصلی</a>
          {% for category in categories %}<a href="/category/{{ category.slug }}">{{ category.name }}</a>{% endfor %}
        </nav>
      </div>
{% endblock %}
